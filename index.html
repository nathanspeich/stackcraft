<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1020" />
    <meta name="description" content="Learn Linux, Python, and SQL by building your stack, one layer a day." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="/stackcraft/favicon.svg" />
    <link rel="apple-touch-icon" href="/stackcraft/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        var s = JSON.parse(localStorage.getItem('stackcraft') || 'null');
        var t = s && s.state && s.state.settings && s.state.settings.theme;
        if (t === 'light') document.documentElement.dataset.theme = 'light';
      } catch (e) {}
    </script>
    <title>Stackcraft</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
